name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      # Catch the case where someone changed the rendering code but forgot
      # to regenerate the committed sample SVGs (which back the README hero
      # and the GitHub Pages live preview).
      - name: Sample drift check
        run: |
          npm run sample
          if ! git diff --exit-code -- sample/; then
            echo "::error::sample/ is out of date - run 'npm run sample' and commit the changes."
            exit 1
          fi
